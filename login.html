<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Gilgit Adventure Treks</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <style>
    :root {
      --primary: #2D6A4F;
      --primary-light: #40916C;
      --primary-dark: #1B4332;
      --gold: #D4A03C;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --text-light: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Times New Roman', Times, serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    }
    .login-card {
      background: var(--card);
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 420px;
    }
    .login-card .logo-area {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .login-card .logo-area img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin-bottom: 0.5rem;
    }
    .login-card h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 0.25rem;
      font-size: 1.5rem;
    }
    .login-card .subtitle {
      text-align: center;
      color: var(--text-light);
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
    }
    .error-msg {
      background: #fef2f2;
      color: var(--danger);
      padding: 0.75rem;
      border-radius: var(--radius);
      margin-bottom: 1rem;
      font-size: 0.875rem;
      display: none;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: var(--text);
    }
    .form-control {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(45,106,79,0.1);
    }
    .btn-primary {
      width: 100%;
      padding: 0.7rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: var(--primary-dark);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .links {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.875rem;
      color: var(--text-light);
    }
    .links a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .links a:hover {
      text-decoration: underline;
    }
    .password-wrapper {
      position: relative;
    }
    .password-wrapper .form-control {
      padding-right: 2.5rem;
    }
    .eye-toggle {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-light);
      padding: 0;
      display: flex;
      align-items: center;
    }
    .eye-toggle:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="logo-area">
        <img src="images/logo.png" alt="Gilgit Adventure Treks">
      </div>
      <h1>Gilgit Adventure Treks</h1>
      <p class="subtitle">Sign in to your account</p>

      <div class="error-msg" id="errorMsg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            <button type="button" class="eye-toggle" id="eyeToggle" aria-label="Show password">
              <svg id="eyeOpen" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="eyeClosed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Sign In</button>
      </form>

      <div class="links">
        <p><a href="forgot-password.html">Forgot Password?</a></p>
        <p style="margin-top:0.5rem;">Don't have an account? <a href="register.html">Create one</a></p>
        <p style="margin-top:0.5rem;"><a href="index.html">Back to Home</a></p>
      </div>
    </div>
  </div>

  <script>
    // Toggle password visibility
    document.getElementById('eyeToggle').addEventListener('click', function() {
      var pwd = document.getElementById('password');
      var open = document.getElementById('eyeOpen');
      var closed = document.getElementById('eyeClosed');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        open.style.display = 'none';
        closed.style.display = 'block';
      } else {
        pwd.type = 'password';
        open.style.display = 'block';
        closed.style.display = 'none';
      }
    });

    // Get redirect destination from URL params
    var redirectUrl = new URLSearchParams(window.location.search).get('redirect') || 'profile.html';

    // If already logged in, redirect
    if (localStorage.getItem('user_token')) {
      window.location.href = redirectUrl;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('errorMsg');
      const submitBtn = document.getElementById('submitBtn');
      errorEl.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/users/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.message || 'Login failed';
          errorEl.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
          return;
        }

        localStorage.setItem('user_token', data.token);
        localStorage.setItem('user_name', data.name);
        localStorage.setItem('user_email', data.email);
        localStorage.setItem('user_avatar', data.avatar || '');
        window.location.href = redirectUrl;
      } catch (err) {
        errorEl.textContent = 'Network error. Is the server running?';
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    // Dynamic branding from site settings
    fetch('/api/page-data?need=').then(r => r.json()).then(d => {
      if (d.settings && d.settings.branding) {
        var b = d.settings.branding;
        if (b.logoUrl) document.querySelector('.logo-area img').src = b.logoUrl;
        if (b.companyName) {
          document.querySelector('.login-card h1').textContent = b.companyName;
          document.title = 'Login — ' + b.companyName;
        }
        if (b.faviconUrl) document.querySelector('link[rel="icon"]').href = b.faviconUrl;
      }
    }).catch(function(){});
  </script>
</body>
</html>
